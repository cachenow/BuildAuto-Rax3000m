name: Build OpenWrt Worker

on:
  workflow_call:
    inputs:
      variant:
        description: nand or emmc
        required: true
        type: string
      attempt:
        description: 1 to 8 for CPU selection
        required: false
        type: number
        default: 1
    outputs:
      cpu_accepted:
        description: true if the runner CPU was accepted
        value: ${{ jobs.build.outputs.cpu_accepted }}

env:
  REPO_URL:  https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-24.10
  FEEDS_CONF: feeds.conf.default
  CONFIG_NAND_FILE: .config-nand
  CONFIG_EMMC_FILE: .config-emmc
  DIY_P1_SH: diy-part1.sh
  DIY_P2_NAND_SH: diy-part2-nand.sh
  DIY_P2_EMMC_SH: diy-part2-emmc.sh
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: true
  UPLOAD_COWTRANSFER: false
  UPLOAD_WETRANSFER: false
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    name: Compile ${{ inputs.variant }}
    runs-on: ubuntu-22.04
    outputs:
      cpu_accepted: ${{ steps.cpu_gate.outputs.cpu_accepted }}
    steps:
    - name: CPU Gate
      id: cpu_gate
      shell: bash
      env:
        VARIANT: ${{ inputs.variant }}
        ATTEMPT: ${{ inputs.attempt }}
      run: |
        CPU="$(grep -m1 '^model name' /proc/cpuinfo || true)"
        echo "CPU: $CPU"
        echo "Runner: $(nproc) vCPU"
        case "$CPU" in
          *9V45*|*6973P-C*|*8573C*|*9V74*)
            echo 'cpu_accepted=true' >> "$GITHUB_OUTPUT"
            echo "Accepted: $CPU" >> "$GITHUB_STEP_SUMMARY"
            ;;
          *)
            echo 'cpu_accepted=false' >> "$GITHUB_OUTPUT"
            echo "Rejected: $CPU. Skipping $VARIANT build on this runner." >> "$GITHUB_STEP_SUMMARY"
            if (( ATTEMPT >= 8 )); then
              echo "::error::8 CPU attempts exhausted for $VARIANT without a matching runner"
              exit 1
            fi
            ;;
        esac

    - name: Check Server Performance
      if: steps.cpu_gate.outputs.cpu_accepted == 'true'
      run: |
        echo "警告⚠"
        echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
        echo -e "已知CPU型号(降序): 7763，8370C，8272CL，8171M，E5-2673\n"
        echo "--------------------------CPU信息--------------------------"
        echo "CPU物理数量: $(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
        echo "CPU核心数量: $(nproc)"
        echo -e "CPU型号信息:$(cat /proc/cpuinfo | grep -m1 name | awk -F: '{print $2}')\n"
        echo "--------------------------内存信息--------------------------"
        echo "已安装内存详细信息:"
        echo -e "$(sudo lshw -short -C memory | grep GiB)\n"
        echo "--------------------------硬盘信息--------------------------"
        echo "硬盘数量: $(ls /dev/sd* | grep -v [1-9] | wc -l)" && df -hT

    - name: Initialization Environment
      if: steps.cpu_gate.outputs.cpu_accepted == 'true'
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        docker image prune -af
        sudo rm -rf /usr/share/dotnet /etc/apt/sources.list.d /usr/local/lib/android $AGENT_TOOLSDIRECTORY
        sudo -E apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
        sudo -E apt-get -y update
        sudo -E apt-get -y install $(curl -fsSL is.gd/depends_ubuntu_2204)
        sudo -E systemctl daemon-reload
        sudo -E apt-get -y autoremove --purge
        sudo -E apt-get -y clean
        sudo timedatectl set-timezone "$TZ"

    - name: Combine Disks
      if: steps.cpu_gate.outputs.cpu_accepted == 'true'
      uses: easimon/maximize-build-space@master
      with:
        swap-size-mb: 1024
        temp-reserve-mb: 100
        root-reserve-mb: 1024

    - name: Checkout
      if: steps.cpu_gate.outputs.cpu_accepted == 'true'
      uses: actions/checkout@v4

    - name: Clone source code
      if: steps.cpu_gate.outputs.cpu_accepted == 'true'
      run: |
        df -hT $GITHUB_WORKSPACE
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        cd openwrt
        echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV

    - name: Load custom feeds
      if: steps.cpu_gate.outputs.cpu_accepted == 'true'
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF $OPENWRT_PATH/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd $OPENWRT_PATH
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      if: steps.cpu_gate.outputs.cpu_accepted == 'true'
      run: cd $OPENWRT_PATH && ./scripts/feeds update -a

    - name: Install feeds
      if: steps.cpu_gate.outputs.cpu_accepted == 'true'
      run: cd $OPENWRT_PATH && ./scripts/feeds install -a

    - name: Load custom configuration
      if: steps.cpu_gate.outputs.cpu_accepted == 'true'
      run: |
        [ -e files ] && mv files $OPENWRT_PATH/files
        cd $OPENWRT_PATH
        # Keep wpad-openssl and make EasyMesh depend on it instead of wpad-mbedtls.
        sed -i "s/+wpad-mbedtls/+wpad-openssl/" feeds/kwrt/luci-app-easymesh/Makefile
        
        # Execute variant-specific DIY script
        if [ "${{ inputs.variant }}" = "nand" ]; then
          chmod +x "$GITHUB_WORKSPACE/$DIY_P2_NAND_SH"
          "$GITHUB_WORKSPACE/$DIY_P2_NAND_SH"
        else
          chmod +x "$GITHUB_WORKSPACE/$DIY_P2_EMMC_SH"
          "$GITHUB_WORKSPACE/$DIY_P2_EMMC_SH"
        fi
        
        # Select matrix config
        if [ "${{ inputs.variant }}" = "nand" ]; then
          cp -f "$GITHUB_WORKSPACE/$CONFIG_NAND_FILE" .config
        else
          cp -f "$GITHUB_WORKSPACE/$CONFIG_EMMC_FILE" .config
        fi

    - name: Download package
      if: steps.cpu_gate.outputs.cpu_accepted == 'true'
      id: package
      run: |
        cd $OPENWRT_PATH
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      if: steps.cpu_gate.outputs.cpu_accepted == 'true'
      id: compile
      run: |
        cd $OPENWRT_PATH
        echo -e "$(nproc) thread compile"
        make defconfig
        make -j$(nproc) || make -j1 || make -j1 V=s

        # Rename sysupgrade filename by variant
        FW_DIR=$(ls -d bin/targets/*/*)
        cd "$FW_DIR"
        SYS=$(ls *squashfs-sysupgrade.itb 2>/dev/null | head -n1)
        if [ -n "$SYS" ]; then
          if [ "${{ inputs.variant }}" = "nand" ]; then
            mv -f "$SYS" "immortalwrt-mediatek-filogic-cmcc_rax3000m-nand-squashfs-sysupgrade.itb"
          else
            mv -f "$SYS" "immortalwrt-mediatek-filogic-cmcc_rax3000m-emmc-squashfs-sysupgrade.itb"
          fi
        fi
        cd "$OPENWRT_PATH"

        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled()) && steps.cpu_gate.outputs.cpu_accepted == 'true'
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true' && steps.cpu_gate.outputs.cpu_accepted == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}-${{ inputs.variant }}
        path: ${{ env.OPENWRT_PATH }}/bin

    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true' && !cancelled() && steps.cpu_gate.outputs.cpu_accepted == 'true'
      run: |
        cd $OPENWRT_PATH/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT


    - name: Upload firmware directory
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled() && steps.cpu_gate.outputs.cpu_accepted == 'true'
      with:
        name: firmware-${{ inputs.variant }}
        path: ${{ env.FIRMWARE }}
